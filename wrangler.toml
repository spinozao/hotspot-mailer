name = "hotspot-mailer-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Workers 路由配置
routes = [
  { pattern = "*/api/*", zone_name = "your-domain.com" }
]

# 环境变量（可选）
[env.production.vars]
ENVIRONMENT = "production"

# KV 命名空间（用于存储配置）
# [[kv_namespaces]]
# binding = "CONFIG_KV"
# id = "your-kv-namespace-id"

# Cron 触发器（定时任务）
[triggers]
crons = ["0 8 * * *", "0 18 * * *"]  # 每天 8:00 和 18:00 触发
