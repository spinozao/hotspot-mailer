<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - HotSpot Mailer</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="stars"></div>
    <div class="twinkling"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="shield"></i>
                </div>
                <div class="logo-text">
                    <h1>管理后台</h1>
                    <p>System Administration</p>
                </div>
            </div>
            <div class="header-actions">
                <span id="adminUser" class="admin-badge">Admin</span>
                <button id="logoutBtn" class="btn-outline">
                    <i data-lucide="log-out"></i> 退出
                </button>
            </div>
        </header>

        <main class="main-content">
            <div class="dashboard-grid">
                <!-- Stats -->
                <div class="stat-card glass-panel">
                    <div class="stat-icon"><i data-lucide="mail"></i></div>
                    <div class="stat-info">
                        <h3>已发送邮件</h3>
                        <p class="stat-number">1,234</p>
                    </div>
                </div>
                <div class="stat-card glass-panel">
                    <div class="stat-icon"><i data-lucide="users"></i></div>
                    <div class="stat-info">
                        <h3>活跃订阅</h3>
                        <p class="stat-number">56</p>
                    </div>
                </div>
                <div class="stat-card glass-panel">
                    <div class="stat-icon"><i data-lucide="activity"></i></div>
                    <div class="stat-info">
                        <h3>系统状态</h3>
                        <p class="stat-status online">运行中</p>
                    </div>
                </div>

                <!-- Recent Logs -->
                <div class="logs-panel glass-panel full-width">
                    <div class="panel-header">
                        <h3><i data-lucide="file-text"></i> 发送日志</h3>
                        <button class="btn-text">查看全部</button>
                    </div>
                    <div class="logs-list">
                        <div class="log-item">
                            <span class="log-time">10:00</span>
                            <span class="log-status success">成功</span>
                            <span class="log-detail">发送日报到 mroma@qq.com</span>
                        </div>
                        <div class="log-item">
                            <span class="log-time">08:00</span>
                            <span class="log-status success">成功</span>
                            <span class="log-detail">批量发送任务完成 (10/10)</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>

</html>
