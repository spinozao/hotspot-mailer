<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="智能热点推送系统 - 自动获取热点资讯，定时发送到您的邮箱">
    <meta name="keywords" content="热点,邮件推送,自动化,资讯订阅">
    <title>智能热点推送系统 | HotSpot Mailer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Effects -->
    <div class="stars"></div>
    <div class="twinkling"></div>
    <div class="nebula"></div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i data-lucide="zap"></i>
                </div>
                <div class="logo-text">
                    <h1>HotSpotMailer</h1>
                    <p>智能热点 · 自动推送 · 365天全年无休</p>
                </div>
            </div>
            <div class="header-actions" id="headerActions">
                <!-- Dynamically rendered by JS -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="config-card glass-panel">
                <div class="card-header">
                    <h2><i data-lucide="settings-2"></i> 推送配置</h2>
                    <p>定制您的专属热点日报，如果您还未登录，配置将保存在本地</p>
                </div>

                <form id="configForm" class="config-form">

                    <!-- 1. Content Settings (Top Priority) -->
                    <section class="form-section">
                        <div class="section-header">
                            <div class="section-icon"><i data-lucide="newspaper"></i></div>
                            <h3>内容设置</h3>
                        </div>

                        <div class="form-group">
                            <label class="form-label">新闻来源（可选择多个）</label>
                            <div class="news-sources-grid">
                                <!-- International -->
                                <div class="source-category">
                                    <h4 class="category-title">国际门户</h4>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="cnn" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="globe"></i> CNN</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="bbc" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="globe-2"></i> BBC</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="nhk" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="tv"></i> NHK</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="yahoo" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="news"></i> Yahoo</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="reuters" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="file-text"></i> Reuters</span>
                                    </label>
                                </div>

                                <!-- Google -->
                                <div class="source-category">
                                    <h4 class="category-title">谷歌服务</h4>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="google-news"
                                            class="checkbox-input" checked>
                                        <span class="checkbox-label"><i data-lucide="chrome"></i> Google News</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="google-en"
                                            class="checkbox-input" checked>
                                        <span class="checkbox-label"><i data-lucide="languages"></i> Google(英)</span>
                                    </label>
                                </div>

                                <!-- Chinese -->
                                <div class="source-category">
                                    <h4 class="category-title">中文资讯</h4>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="baidu" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="trending-up"></i> 百度热搜</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="zhihu" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="message-circle"></i> 知乎热榜</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="weibo" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="hash"></i> 微博热搜</span>
                                    </label>
                                </div>

                                <!-- Social Media -->
                                <div class="source-category">
                                    <h4 class="category-title">社交媒体</h4>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="douyin" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="video"></i> 抖音热榜</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="xiaohongshu"
                                            class="checkbox-input" checked>
                                        <span class="checkbox-label"><i data-lucide="heart"></i> 小红书</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="kuaishou" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="zap"></i> 快手热榜</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="tiktok" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="music"></i> TikTok</span>
                                    </label>
                                </div>

                                <!-- Search Engines -->
                                <div class="source-category">
                                    <h4 class="category-title">搜索引擎</h4>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="bing" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="search"></i> Bing News</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="sogou" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="search-code"></i> 搜狗热搜</span>
                                    </label>
                                </div>

                                <!-- Tech -->
                                <div class="source-category">
                                    <h4 class="category-title">科技行业</h4>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="hackernews"
                                            class="checkbox-input" checked>
                                        <span class="checkbox-label"><i data-lucide="terminal"></i> HackerNews</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="github" class="checkbox-input"
                                            checked>
                                        <span class="checkbox-label"><i data-lucide="github"></i> GitHub</span>
                                    </label>
                                    <label class="source-checkbox">
                                        <input type="checkbox" name="newsSource" value="techcrunch"
                                            class="checkbox-input" checked>
                                        <span class="checkbox-label"><i data-lucide="cpu"></i> TechCrunch</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Custom Source -->
                        <div class="form-group">
                            <label class="form-label">自定义来源</label>
                            <div id="customSourcesContainer">
                                <!-- Dynamic custom sources -->
                            </div>
                            <button type="button" class="btn-outline btn-sm" id="addCustomSourceBtn">
                                <i data-lucide="plus"></i> 添加自定义源
                            </button>
                        </div>

                        <!-- Domains -->
                        <div class="form-group">
                            <label for="contentDomain" class="form-label">关注领域</label>
                            <input type="text" id="contentDomain" class="form-input" placeholder="科技、娱乐、财经、体育、游戏..."
                                required>
                            <span class="form-hint">多个领域请用逗号分隔</span>
                        </div>

                        <!-- Limits -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="itemCount" class="form-label">每次推送条数</label>
                                <input type="number" id="itemCount" class="form-input" placeholder="10" min="1" max="50"
                                    value="10" required>
                            </div>
                            <div class="form-group">
                                <label for="wordLimit" class="form-label">每条字数限制</label>
                                <input type="number" id="wordLimit" class="form-input" placeholder="200" min="50"
                                    max="1000" value="200" required>
                            </div>
                        </div>
                    </section>

                    <!-- 2. Email Settings -->
                    <section class="form-section">
                        <div class="section-header">
                            <div class="section-icon"><i data-lucide="mail"></i></div>
                            <h3>邮件设置</h3>
                        </div>

                        <!-- Recipients -->
                        <div class="form-group">
                            <label class="form-label">接收邮箱（可添加多个）</label>
                            <div id="recipientsContainer">
                                <div class="recipient-item">
                                    <input type="email" class="form-input recipient-input"
                                        placeholder="email@example.com" required>
                                </div>
                            </div>
                            <button type="button" class="btn-outline btn-sm" id="addRecipientBtn"
                                style="margin-top: 10px;">
                                <i data-lucide="user-plus"></i> 添加收件人
                            </button>
                        </div>

                        <!-- Sender Settings -->
                        <div class="sender-settings-box">
                            <h4 class="sub-title">发件人配置 (SMTP)</h4>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="senderEmail" class="form-label">发件邮箱</label>
                                    <input type="email" id="senderEmail" class="form-input"
                                        placeholder="your-email@qq.com" required>
                                </div>
                                <div class="form-group">
                                    <label for="authCode" class="form-label">
                                        授权码
                                        <a href="#" class="info-link" onclick="alert('请登录邮箱设置->账户->开启SMTP获取授权码')">
                                            <i data-lucide="help-circle"></i>
                                            如何获取?
                                        </a>
                                    </label>
                                    <input type="password" id="authCode" class="form-input" placeholder="请输入SMTP授权码"
                                        required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="smtpServer" class="form-label">SMTP服务器</label>
                                    <input type="text" id="smtpServer" class="form-input" value="smtp.qq.com"
                                        placeholder="smtp.qq.com">
                                </div>
                                <div class="form-group">
                                    <label for="smtpPort" class="form-label">端口</label>
                                    <select id="smtpPort" class="form-select">
                                        <option value="465">465 (SSL/TLS)</option>
                                        <option value="587">587 (STARTTLS)</option>
                                        <option value="25">25 (普通)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 3. Schedule Settings -->
                    <section class="form-section">
                        <div class="section-header">
                            <div class="section-icon"><i data-lucide="clock"></i></div>
                            <h3>定时设置</h3>
                        </div>

                        <div class="form-group">
                            <label class="form-label">发送时间（每天）</label>
                            <div id="scheduleContainer">
                                <div class="schedule-item">
                                    <input type="time" class="form-input schedule-input" value="08:00" required>
                                </div>
                            </div>
                            <button type="button" class="btn-outline btn-sm" id="addTimeBtn" style="margin-top: 10px;">
                                <i data-lucide="plus-circle"></i> 添加发送时间
                            </button>
                        </div>

                        <div class="form-group">
                            <label for="runDays" class="form-label">运行天数</label>
                            <input type="number" id="runDays" class="form-input" value="365" min="1" max="3650">
                            <span class="form-hint">设置服务持续运行的天数</span>
                        </div>
                    </section>

                    <!-- Submit Actions -->
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="testEmailBtn">
                            <i data-lucide="send"></i> 测试发送
                        </button>
                        <button type="submit" class="btn-primary">
                            <i data-lucide="save"></i> 保存并启动
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2025 HotSpot Mailer. All rights reserved.</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i data-lucide="info" id="toastIcon"></i>
        <span id="toastMessage">Notification</span>
    </div>

    <script src="app.js"></script>
</body>

</html>
