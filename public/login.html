<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="管理员登录 - HotSpot Mailer">
    <title>Admin Login | HotSpot Mailer</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <!-- Animated Background -->
    <div class="background">
        <div class="stars"></div>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Login Card -->
        <div class="login-card">
            <!-- Logo Section -->
            <div class="login-header">
                <div class="logo-circle">
                    <i data-lucide="shield-check" class="logo-icon"></i>
                </div>
                <h1 class="login-title">Administrator</h1>
                <p class="login-subtitle">HotSpot Mailer Control Panel</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">
                        <i data-lucide="user" class="label-icon"></i>
                        Username
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="form-input" placeholder="Enter your username"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        <i data-lucide="lock" class="label-icon"></i>
                        Password
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter your password"
                            autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i data-lucide="eye" class="toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" class="checkbox-input">
                        <span class="checkbox-text">Remember me</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <span class="btn-text">Sign In</span>
                    <i data-lucide="arrow-right" class="btn-icon"></i>
                </button>

                <div class="error-message" id="errorMessage">
                    <i data-lucide="alert-circle" class="error-icon"></i>
                    <span id="errorText">Invalid credentials</span>
                </div>
            </form>

            <!-- Footer Info -->
            <div class="login-footer">
                <p class="footer-text">
                    <i data-lucide="shield" class="footer-icon"></i>
                    Secured by Cloudflare
                </p>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            <div class="panel-content">
                <div class="panel-icon">
                    <i data-lucide="zap"></i>
                </div>
                <h2 class="panel-title">Welcome Back</h2>
                <p class="panel-description">
                    Access your HotSpot Mailer dashboard to manage automated content delivery and configuration
                    settings.
                </p>
                <div class="panel-features">
                    <div class="feature-item">
                        <i data-lucide="check-circle" class="feature-icon"></i>
                        <span>Automated Scheduling</span>
                    </div>
                    <div class="feature-item">
                        <i data-lucide="check-circle" class="feature-icon"></i>
                        <span>Real-time Analytics</span>
                    </div>
                    <div class="feature-item">
                        <i data-lucide="check-circle" class="feature-icon"></i>
                        <span>Secure Configuration</span>
                    </div>
                </div>
            </div>
            <div class="panel-decoration">
                <div class="decoration-circle"></div>
                <div class="decoration-circle"></div>
                <div class="decoration-circle"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i data-lucide="check-circle" class="toast-icon"></i>
        <span class="toast-message">Login successful!</span>
    </div>

    <script src="login.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>

</html>
